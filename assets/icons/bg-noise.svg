<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
  <filter id="noiseFilter" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.420" numOctaves="3" seed="26" result="turb"/>
      <feComponentTransfer in="turb" result="contrast">
        <feFuncR type="linear" slope="1.250" intercept="-0.125"/>
        <feFuncG type="linear" slope="1.250" intercept="-0.125"/>
        <feFuncB type="linear" slope="1.250" intercept="-0.125"/>
      </feComponentTransfer>
    <feColorMatrix type="matrix" values="0 0 0 0 0.1725  0 0 0 0 0.1490  0 0 0 0 0.1490  0.2126 0.7152 0.0722 0 0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.510"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#123b5d"/>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>
